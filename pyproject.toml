[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electoral-forensics"
version = "0.1.0"
description = "Statistical screening of precinct-level election returns: digit tests and robust outlier detection."
authors = [{ name = "Mateo Aranguren" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
electoral-report = "electoral_forensics.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
